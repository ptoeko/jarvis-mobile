# Публикация посредника «ИИ агент» на Cloudflare Workers.
# Запускается при изменении папки proxy/ в main или вручную (Actions → «Посредник ИИ агента» → Run workflow).
# Нужные секреты репозитория (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID — доступ к Cloudflare;
#   GEMINI_API_KEY или ANTHROPIC_API_KEY — ключ ИИ (в приложение не попадает).
#     Если задан GEMINI_API_KEY — агент работает на Gemini, иначе на Anthropic;
#   JARVIS_ACCESS_CODE — код доступа, его же вводят в приложении.
name: Посредник ИИ агента

on:
  push:
    branches: [main]
    paths: ['proxy/**', '.github/workflows/agent.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Публикация посредника
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверка секретов
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODE: ${{ secrets.JARVIS_ACCESS_CODE }}
        run: |
          missing=""
          [ -n "$CF_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$GEMINI_KEY$ANTHROPIC_KEY" ] || missing="$missing GEMINI_API_KEY(или ANTHROPIC_API_KEY)"
          [ -n "$CODE" ] || missing="$missing JARVIS_ACCESS_CODE"
          if [ -n "$missing" ]; then
            echo "::error title=Не заданы секреты::$missing — см. INSTALL-AI.md"
            exit 1
          fi
          if [ ${#CODE} -lt 16 ]; then
            echo "::error title=Код доступа::JARVIS_ACCESS_CODE короче 16 символов"
            exit 1
          fi
      - name: Тесты посредника
        run: node --test tests/unit/proxy.test.mjs tests/unit/proxy-gemini.test.mjs tests/unit/v060.test.mjs
      - name: Выбор модели Gemini
        id: model
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "provider=anthropic" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PICK=$(node proxy/pick-gemini-model.mjs)
          MODEL=$(node -e "console.log(JSON.parse(process.argv[1]).model)" "$PICK")
          IMAGE_MODEL=$(node -e "console.log(JSON.parse(process.argv[1]).imageModel || '')" "$PICK")
          FALLBACK=$(node -e "console.log((JSON.parse(process.argv[1]).fallback || []).join(','))" "$PICK")
          echo "fallback=$FALLBACK" >> "$GITHUB_OUTPUT"
          echo "provider=gemini" >> "$GITHUB_OUTPUT"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "image_model=$IMAGE_MODEL" >> "$GITHUB_OUTPUT"
          echo "Поставщик ИИ: Gemini, модель: $MODEL, изображения: ${IMAGE_MODEL:-нет}" >> "$GITHUB_STEP_SUMMARY"
      - name: Публикация
        id: deploy
        working-directory: proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODE: ${{ secrets.JARVIS_ACCESS_CODE }}
          PROVIDER: ${{ steps.model.outputs.provider }}
          GEMINI_MODEL: ${{ steps.model.outputs.model }}
          GEMINI_IMAGE_MODEL: ${{ steps.model.outputs.image_model }}
          GEMINI_FALLBACK_MODELS: ${{ steps.model.outputs.fallback }}
        run: |
          set -o pipefail
          if [ "$PROVIDER" = "gemini" ]; then
            npx --yes wrangler@4 deploy --var "PROVIDER:gemini" --var "GEMINI_MODEL:$GEMINI_MODEL" --var "GEMINI_IMAGE_MODEL:$GEMINI_IMAGE_MODEL" --var "GEMINI_FALLBACK_MODELS:$GEMINI_FALLBACK_MODELS" 2>&1 | tee deploy.log
            printf '%s' "$GEMINI_KEY" | npx --yes wrangler@4 secret put GEMINI_API_KEY
          else
            npx --yes wrangler@4 deploy --var "PROVIDER:anthropic" 2>&1 | tee deploy.log
            printf '%s' "$ANTHROPIC_KEY" | npx --yes wrangler@4 secret put ANTHROPIC_API_KEY
          fi
          printf '%s' "$CODE" | npx --yes wrangler@4 secret put ACCESS_CODE
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then
            echo "::error title=Адрес не найден::Включите поддомен workers.dev в Cloudflare (Workers & Pages → открыть один раз) и запустите снова."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Проверка связи и ключа ИИ
        env:
          URL: ${{ steps.deploy.outputs.url }}
          CODE: ${{ secrets.JARVIS_ACCESS_CODE }}
        run: |
          sleep 5
          curl -sf -H "Authorization: Bearer $CODE" "$URL/v1/health" > /dev/null \
            || { echo "::error title=Посредник не отвечает::$URL/v1/health"; exit 1; }
          RESP=$(curl -s -H "Authorization: Bearer $CODE" -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","text":"Ответь одним словом: готов"}]}' "$URL/v1/chat")
          echo "::notice title=Адрес посредника для приложения::$URL"
          echo "### Посредник опубликован" >> "$GITHUB_STEP_SUMMARY"
          echo "Адрес для Настроек JARVIS: \`$URL\`" >> "$GITHUB_STEP_SUMMARY"
          if echo "$RESP" | grep -q 'Исчерпан лимит'; then
            echo "::warning title=Лимит запросов ИИ::Посредник работает. Бесплатный лимит запросов сейчас исчерпан — агент ответит позже; повторно запускать не нужно."
            echo "Лимит запросов ИИ сейчас исчерпан — агент ответит позже." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if echo "$RESP" | grep -q 'не пополнен'; then
            # Баланс можно пополнить позже — посредник уже готов.
            echo "::warning title=Баланс ИИ не пополнен::Посредник работает. ИИ агент начнёт отвечать после пополнения баланса; повторно запускать не нужно."
            echo "Баланс ИИ не пополнен — агент заработает после пополнения." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if echo "$RESP" | grep -q '"error"'; then
            echo "::error title=ИИ агент не отвечает::$(echo "$RESP" | head -c 300)"
            exit 1
          fi
          echo "ИИ агент отвечает." >> "$GITHUB_STEP_SUMMARY"
      - name: Проверка возможностей агента (Word, поиск, изображения)
        # Не останавливает публикацию: результат — в итогах запуска.
        continue-on-error: true
        env:
          URL: ${{ steps.deploy.outputs.url }}
          CODE: ${{ secrets.JARVIS_ACCESS_CODE }}
        run: |
          # Ответ сохраняется в файл: ответ с изображением слишком велик для
          # передачи в командной строке.
          ask() {
            curl -s --max-time 120 -H "Authorization: Bearer $CODE" -H 'Content-Type: application/json' \
              -d "{\"messages\":[{\"role\":\"user\",\"text\":\"$1\"}]}" "$URL/v1/chat" > "$RUNNER_TEMP/answer.json"
          }
          report() { node -e '
            const fs = require("fs");
            const [label, file] = process.argv.slice(1);
            const raw = fs.readFileSync(file, "utf8");
            let d; try { d = JSON.parse(raw); } catch { d = { error: raw.slice(0, 200) }; }
            const kinds = (d.files || []).map((f) => f.kind).join(",") || "нет";
            const text = String(d.text || d.error || "").replace(/\s+/g, " ").slice(0, 300);
            console.log(`| ${label} | ${kinds} | ${text.replace(/\|/g, "/")} |`);
          ' "$1" "$RUNNER_TEMP/answer.json" >> "$GITHUB_STEP_SUMMARY"; }
          echo "### Проверка возможностей агента" >> "$GITHUB_STEP_SUMMARY"
          echo "| Проверка | Файлы | Ответ |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          ask 'Создай документ Word с именем Проверка: заголовок Проверка и один абзац Тест. Без пояснений.'
          report "Документ Word"
          sleep 20
          ask 'Найди в интернете официальный сайт Минстроя России. Ответь одной строкой со ссылкой.'
          report "Поиск в интернете"
          sleep 20
          ask 'Создай изображение: простой красный квадрат на белом фоне. Без пояснений.'
          report "Изображение"
          sleep 5
          ask 'Кто тебя создал и какая ты модель?'
          report "Кто ты"
          sleep 5
          curl -s --max-time 60 -H "Authorization: Bearer $CODE" -H 'Content-Type: application/json' \
            -d '{"text":"На двери замок. Поиск в осях ведомостей."}' "$URL/v1/accent" > "$RUNNER_TEMP/answer.json"
          report "Ударения"
          sleep 5
          ask 'Сделай сводку в Excel: здание 10UJA бетон 125,5 м3, здание 10UKA бетон 74,5 м3, с итогом. Без пояснений.'
          report "Сводка Excel"
          sleep 5
          ask 'Занеси в реестр: здание 10UJA, оси 3-5, трещина в стене, срок до 20.11.2026'
          node -e 'const d = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); console.log(`| Реестр голосом | черновиков: ${(d.drafts || []).length} | ${String(d.text || d.error || "").replace(/\s+/g, " ").slice(0, 200)} |`)' "$RUNNER_TEMP/answer.json" >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
